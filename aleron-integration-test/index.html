<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Canvas scoping test</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        max-width: 60rem;
        margin: 2rem auto;
        padding: 0 1.25rem;
      }
      h1 { font-size: 1.6rem; }
      h2 { font-size: 1.2rem; margin-top: 2rem; }
      code, pre { font-family: ui-monospace, monospace; font-size: 0.85em; }
      pre {
        overflow: auto;
        max-height: 22rem;
        white-space: pre-wrap;
        word-break: break-word;
        padding: 0.75rem;
        background: color-mix(in srgb, currentColor 8%, transparent);
      }
      details { margin: 0.35rem 0; }
      summary { cursor: pointer; }
      table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
      th, td { text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
      th { font-weight: 600; }
      button, a.btn {
        display: inline-block;
        font: inherit;
        padding: 0.45rem 0.9rem;
        margin: 0.2rem 0.4rem 0.2rem 0;
        border: 1px solid currentColor;
        border-radius: 6px;
        background: none;
        color: inherit;
        cursor: pointer;
        text-decoration: none;
      }
      .pass { color: #0a7f3f; font-weight: 600; }
      .fail { color: #c02626; font-weight: 600; }
      .muted { opacity: 0.7; }
      .subject::after { content: " ← scoped subject"; opacity: 0.7; font-weight: 400; }
      /* currentColor rather than a fixed colour, because the page follows the
         reader's light/dark preference and a hardcoded tint reads wrong in one
         of them. */
      tr.selected td { background: color-mix(in srgb, currentColor 8%, transparent); }
      tr.selected td:first-child { box-shadow: inset 0.2rem 0 currentColor; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
